<!DOCTYPE html>
<html>
<head>
  <title>Smart Hassle Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚀 Smart Hassle Solver</h1>

<div class="box">
  <input type="text" id="problem" placeholder="Enter your problem">
  <input type="number" id="time" placeholder="Time wasted (min)">
  <button onclick="add()">Add</button>
</div>

<div class="box">
  <h3>📋 Problems</h3>
  <ul id="list"></ul>
</div>

<div class="box">
  <h3>📊 Total Time Wasted</h3>
  <p id="totalTime">0 minutes</p>
</div>

<div class="box">
  <h3>💡 Smart Suggestion</h3>
  <p id="suggestion">No data yet</p>
</div>

<script src="script.js"></script>
</body>
</html>
